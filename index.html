<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Ondas Sonoras - Académico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/assets/styles/global.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <h1>Simulador de Ondas Sonoras</h1>
            <p class="subtitle">Laboratorio Virtual de Acústica</p>
        </header>
        
        <div class="main-content">
            <!-- Área de Simulación -->
            <div class="simulation-area">
                <div class="canvas-container" id="contenedorCanvas">
                    <!-- PixiJS creará el canvas aquí -->
                </div>
                
                <!-- Controles de reproducción inferiores -->
                <div class="playback-controls">
                    <div class="btn-group">
                        <button id="btnPlayPause" class="action-btn">Pausar</button>
                        <button id="btnPaso" class="action-btn secondary">Paso a Paso</button>
                    </div>
                    
                    <!-- NUEVO: Modo de Emisión (Onda continua o Pulso) -->
                    <div class="radio-group horizontal card-style">
                        <span>Emisión:</span>
                        <label><input type="radio" name="modoEmision" value="continuo" checked> Continuo</label>
                        <label><input type="radio" name="modoEmision" value="pulso"> Pulso</label>
                    </div>

                    <div class="radio-group horizontal card-style">
                        <label><input type="radio" name="velocidad" value="normal" checked> Normal</label>
                        <label><input type="radio" name="velocidad" value="lento"> Lento</label>
                    </div>
                </div>
            </div>
            
            <!-- Panel de Controles -->
            <aside class="sidebar-controls">
                <div class="control-card">
                    <h3>Parámetros</h3>
                    <div class="control-group">
                        <div class="label-row">
                            <label for="sliderFrecuencia">Frecuencia</label>
                            <span class="value-display"><span id="valorFrecuencia">2.0</span> Hz</span>
                        </div>
                        <input type="range" id="sliderFrecuencia" min="1" max="5" step="0.1" value="2">
                    </div>

                    <div class="control-group">
                        <div class="label-row">
                            <label for="sliderAmplitud">Amplitud</label>
                            <span class="value-display"><span id="valorAmplitud">50</span>%</span>
                        </div>
                        <input type="range" id="sliderAmplitud" min="10" max="100" step="5" value="50">
                    </div>
                </div>

                <div class="control-card">
                    <h3>Visualización</h3>
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="checkGraficas" checked> Mostrar Gráficas</label>
                        <label><input type="checkbox" id="checkSonido" checked> Reproducir Tono</label>
                    </div>
                    
                    <div class="divider"></div>
                    
                    <div class="radio-group vertical">
                        <label><input type="radio" name="modoVista" value="ondas"> Solo Ondas</label>
                        <label><input type="radio" name="modoVista" value="particulas"> Solo Partículas</label>
                        <label><input type="radio" name="modoVista" value="ambos" checked> Ambos Modos</label>
                    </div>
                </div>

                <!-- NUEVO: Perspectiva en el sidebar -->
                <div class="control-card">
                    <h3>Perspectiva</h3>
                    <div class="radio-group vertical">
                        <label><input type="radio" name="perspectiva" value="superior" checked> Vista Superior</label>
                        <label><input type="radio" name="perspectiva" value="lateral"> Vista Lateral</label>
                    </div>
                </div>

                <button id="btnReiniciar" class="danger-btn">Reiniciar Simulación</button>
            </aside>
        </div>
    </div>
    <script type="module" src="/src/principal.js"></script>
</body>
</html>
